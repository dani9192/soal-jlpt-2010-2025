<script>
const GI={"a1": "A・問題1 cara baca kata bergaris", "a2": "A・問題2 pilih kanji yang tepat", "a3": "A・問題3 （　）isi kurung", "a4": "A・問題4 arti paling dekat", "a5": "A・問題5 penggunaan kata yang tepat", "b1": "B・文法 問題1 （　）isi kurung", "b2": "B・文法 問題2 ★ susun kalimat", "b3": "B・文法 問題3 bacaan cloze (19)–(23)", "b4": "B・読解 問題4 bacaan pendek", "b5": "B・読解 問題5 bacaan menengah", "b6": "B・読解 問題6 bacaan", "b7": "B・読解 問題7 pengumuman kelas bahasa Jepang"};const P={"c": "<b>カラオケ　マイヤー　レア</b><br>私は歌を歌うのが好きで、友達のゼミの仲間とときどきカラオケに行きます。いつも大勢で行くから、自分一人がずっと歌うということはできません。【19】、カラオケはパーティーみたいで楽しいと思っていました。<br>先日桜駅の近くで「一人カラオケ専門店」という店を見つけました。私はとても驚きました。カラオケは人と一緒に楽しむものだと【20】。次の日、学校で友達にその店のことを話すと、友達は普通のカラオケ店にも一人で行くと言ったので、もっと驚きました。カラオケに一人で行くというのは、考えたこともありませんでした。<br>一人で行ってもいいとわかって、私も一人で【21】。<br>私はどきどきしながら、受付で名前を書きました。そして、【22】に入り、まだ上手に歌えない日本語の歌を練習したり、好きな歌を繰返し歌ったりしました。いろいろな歌を自由に歌うのは気持ちがよかったです。一人で2時間も歌ってしまいました。<br>カラオケは一人【23】楽しかったです。これからもっとカラオケに行くことが増えそうです。", "r1": "<b>(1) Nama anak</b><br>姉に女の子が生まれた。子供の名前は「はるか」だそうだ。日本人の名前は漢字を使ったものが多く、ひらがなだけの名前は珍しい。小さいころから自分で書けるからそうしたのかと思って、姉に聞いてみた。すると、ひらがななら、優しい感じがするからという答えだった。読み間違えられることもないし、覚えてもらいやすいという良い点もあるだろう。ひらがなの名前もいいなと思った。", "r2": "<b>(2) Surat Mariko untuk Rana</b><br>これは、まり子さんが友達のラナさんに書いた手紙である。<br>ラナさん<br>こんにちは。コンサートのチケットを送ります。来週の金曜日、楽しみですね。<br>実は、当日、急な仕事が入ってしまいました。この前のコンサートのときは駅の改札口で待ち合わせましたが、今回は直接会場に行って、先に中に入っていてくれませんか。がんばって仕事を終わらせるようにしますが、遅れそうだったら、メールしますね。<br>コンサートは18時半開始ですが、会場には18時から入れます。<br>では、金曜日に　まり子", "r3": "<b>(3) Email toko alat tulis</b><br>これは文房具店が客の寺市さんに送ったメールである。<br>寺市商店　寺市様<br>いつもお世話になっております。ご注文の商品を昨日送りしたのですが、間違いがございました。大変申し訳ありません。ご注文をいただいていたのは、コピー用紙1箱、のり5本でしたが、のりは3本しかお送りしておりませんでした。<br>今朝、急いで残りを送りいたしましたので明日の朝に届く予定です。ご迷惑をおかけして申し訳ありません。<br>ナカノ文房具　中野", "r4": "<b>(4) Perjalanan kereta</b><br>私は鉄道の旅が好きだ。特に、田舎をゆっくり走る鉄道の旅は、外の景色を楽しめて最高だ。日本ではかなりの田舎でも鉄道は通っている。人が少ない田舎にまで作られたのは、自動車より前に鉄道が移動手段として広く使われるようになったからだそうだ。もし順番が逆だったら、私は今のように田舎の鉄道の旅を楽しめなかっただろう。この歴史に感謝したい。", "r5": "<b>(1) Kartu nama</b><br>「よろしくお願いします。これ、私の名刺です。」<br>先日、あるパーティーで、袋に入った1枚のクッキーを渡された。<u>①「えっ」と思って</u>、よく見ると、クッキーの表に名前と会社名が書いてあった。相手の人は笑いながら「食べられますよ。」と言った。<br>名刺は普通、四角い紙でできている。しかし、最近は変わった名刺を持つ人もいる。会社が作っている商品と同じ形をしたもの、木やプラスチックでできたもの、香りがついたものもあるそうだ。<br>名刺は仕事には必要なものだが、<u>②ほかの人と同じような名刺</u>では、顔や名前をなかなか覚えてもらえない。クッキーの名刺をくれた人によると、このような名刺をすると、すぐに名前を覚えてもらえるだけでなく、話しが広がり、仕事の話がうまくいく場合もあるそうだ。<br>まず、名刺から相手の心をつかむ。これが、最近の新しい仕事のやり方なのかもしれない。", "r6": "<b>(2) Cara memuji anak</b><br>子供はほめて育てろとよく聞きます。でも私が息子をほめると、息子はその時の自分に満足して、それ以上頑張ろうとしなくなることもあります。親の期待の通りにはならないことが多く、ほめ方の難しさを感じています。<br>最近、どうほめたら子供が新しいことにチャレンジする気持ちを持つようになるか、調べた実験の話を聞きました。数百人の子供に難しい問題を10問解かせます。そして、良い結果だった子供たちを二つのグループに分け、一方に「よくできたね。頭がいいね。」と「頭の良さ」を、もう一方に「よく頑張ったね。」と「努力」をほめる言葉をかけます。すると、次の行動に<u>①違い</u>が現れました。<br>実験では続けて、同じ問題をもう一度解くか、新しい問題をやってみるかを選ばせます。そうしたら、頭の良さをほめられたグループでは、間違えると頭が悪いと思われてしまうと考えたからか、多くの子供が同じ問題を解きました。それに対して、努力をほめられたグループでは、90％が新しい問題にチャレンジしたのです。<u>②ほめ方のヒントが隠された面白い実験</u>だと思いました。", "r7": "<b>Hemat listrik musim panas (Kota K)</b><br>最近、日本で夏の平均気温が上がってきていて、非常に暑い日はエアコンがなければ何もできない。そんな日は、ほとんどの人がエアコンのスイッチを入れる。ひどい暑さは体にも悪い影響を与えるし、<u>①しかたないこと</u>だ。しかし、それぞれの家に何台もエアコンがある今、皆が同時にエアコンを使うと、電気の使用量が増えて電気が足りなくなる心配がある。そこで、できるだけ夏の電気の消費量を抑えようという工夫や活動が日本の各地で始まっている。<br>夏に気温が高くなることで有名なK市では、毎年6月から9月まで、「<u>②家のエアコンを止めて、涼しい所に行こう。</u>」と呼びかけている。例えば、木々の多い公園や神社、寺、エアコンのある図書館やレストランやデパートなど、涼しい場所に集まって時間を過ごすのだ。そうすれば、町の中で同時に使われるエアコンはずっと減る。市では、市内の涼しい場所や、この活動に協力してくれる店などが載っている<u>③地図</u>も作り、すべての家に配っている。この地図にある店へ行って、家のエアコンを止めて来たと言えば、飲み物の無料サービスが受けられたり、商品の割引サービスが受けられたりする。<br>電気消費量を抑える効果を期待して始まった活動だが、町の人々がお互いに交流する機会が増え、前よりもっとコミュニケーションが盛んになるという効果も出ているそうだ。", "r8": "<b>Pengumuman kelas bahasa Jepang</b><br><b>東山大学日本語センター　日本語Aクラス　後期　月曜2時間目<br>新聞をつくって、発表しよう！</b><br>○活動内容…10月30日から12月18日までの7回の授業では、4つのグループに分かれて新聞をつくります。グループごとに興味のあることを調べたり、インタビューをしたりします。最後の回には、完成した新聞をクラスで発表してもらいます。<br>○活動場所…201教室とコンピューター室（スケジュールの表で✩★マークの付いている日に、コンピューター室が利用できます）<br>※コンピューター室は、利用時間を前半と後半に分け、2グループずつ使用します。<br><table border=1 cellpadding=4 style='border-collapse:collapse'><tr><td></td><td>前半 10:50～11:25</td><td>後半 11:25～12:00</td></tr><tr><td>✩の日</td><td>グループ A、B</td><td>グループ C、D</td></tr><tr><td>★の日</td><td>グループ C、D</td><td>グループ A、B</td></tr></table>※コンピューター室を利用する日も、授業の最初と最後には201室に集まってください。<br><b>○スケジュール</b><table border=1 cellpadding=4 style='border-collapse:collapse'><tr><td>回</td><td>月日</td><td>活動内容</td><td>PC室</td></tr><tr><td>1</td><td>10月30日</td><td>グループを決め、テーマについて話し合う。</td><td></td></tr><tr><td>2</td><td>11月6日</td><td>各グループで新聞をつくる。</td><td>✩</td></tr><tr><td>3</td><td>11月13日</td><td>各グループで新聞をつくる。</td><td>★</td></tr><tr><td></td><td>11月20日</td><td>授業はありません。</td><td></td></tr><tr><td>4</td><td>11月27日</td><td>各グループで新聞をつくる。</td><td>✩</td></tr><tr><td>5</td><td>12月4日</td><td>各グループで新聞をつくる。</td><td>★</td></tr><tr><td>6</td><td>12月11日</td><td>各グループで新聞をつくる。</td><td></td></tr><tr><td>7</td><td>12月18日</td><td>新聞をクラス内で発表し、教室の外の壁にはる。</td><td></td></tr></table><b>「インタビューについて」</b><br>インタビューは授業時間内に行ってください。インタビューを行う日の<b>1回前の授業の日</b>に、インタビューの案を見せてください。内容や方法に問題がないか、確認します。"};const D=[["a1", "中村部長と<u>直接</u>話した。", ["ちょくぜつ", "ちょうせつ", "ちょくせつ", "ちょうぜつ"], 3, "", null], ["a1", "これはすぐには<u>燃えません</u>。", ["にえません", "ひえません", "きえません", "もえません"], 4, "", null], ["a1", "この<u>位置</u>に車を止めてください。", ["とじ", "いじ", "とち", "いち"], 4, "", null], ["a1", "<u>計算</u>ができたので見てください。", ["けいかく", "けいざん", "けいさん", "けいがく"], 3, "", null], ["a1", "ずっとパソコンを使っていて疲れたので、腕を<u>回して</u>みた。", ["まわして", "おして", "おろして", "のばして"], 1, "", null], ["a1", "ここは<u>禁煙</u>です。", ["きねん", "きえん", "きんねん", "きんえん"], 4, "", null], ["a1", "きれいに<u>結んで</u>ください。", ["たたんで", "むすんで", "つつんで", "ならんで"], 2, "", null], ["a1", "<u>手術</u>をしなくても治りますから、大丈夫ですよ。", ["しゅじゅつ", "てじゅつ", "しゅしゅつ", "てしゅつ"], 1, "", null], ["a2", "次の目標は10<u>びょう</u>です。", ["培", "抄", "倍", "秒"], 4, "", null], ["a2", "ボールが遠くまで<u>とんだ</u>。", ["投んだ", "打んだ", "飛んだ", "転んだ"], 3, "", null], ["a2", "ここは、<u>さかみち</u>が多いですね。", ["岩道", "板道", "石道", "坂道"], 4, "", null], ["a2", "この皿だけ色が<u>ちがいます</u>。", ["遺います", "達います", "遅います", "違います"], 4, "", null], ["a2", "あの会社とは、いい<u>かんけい</u>をつくりたい。", ["関系", "関係", "間係", "間系"], 2, "", null], ["a2", "父は<u>きょうし</u>をしています。", ["教仕", "教帥", "教師", "教任"], 3, "", null], ["a3", "今 const FXH={"0": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>中村<rt>なかむら</rt></ruby><ruby>部長<rt>ぶちょう</rt></ruby>と<span class=fl><ruby>直接<rt>ちょくせつ</rt></ruby></span><ruby>話<rt>はな</rt></ruby>した。</div><div class=idn>🇮🇩 Saya berbicara langsung dengan Kepala Bagian Nakamura.</div></div>", "1": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp>これはすぐには<span class=fl><ruby>燃<rt>も</rt></ruby>えません</span>。</div><div class=idn>🇮🇩 Ini tidak langsung terbakar.</div></div>", "2": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp>この<span class=fl><ruby>位置<rt>いち</rt></ruby></span>に<ruby>車<rt>くるま</rt></ruby>を<ruby>止<rt>と</rt></ruby>めてください。</div><div class=idn>🇮🇩 Tolong parkir mobil di posisi ini.</div></div>", "3": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><span class=fl><ruby>計算<rt>けいさん</rt></ruby></span>ができたので<ruby>見<rt>み</rt></ruby>てください。</div><div class=idn>🇮🇩 Perhitungannya sudah selesai, tolong dilihat.</div></div>", "4": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp>ずっとパソコンを<ruby>使<rt>つか</rt></ruby>っていて<ruby>疲<rt>つか</rt></ruby>れたので、<ruby>腕<rt>うで</rt></ruby>を<span class=fl><ruby>回<rt>まわ</rt></ruby>して</span>みた。</div><div class=idn>🇮🇩 Karena lelah memakai komputer terus-menerus, saya mencoba memutar lengan.</div></div>", "5": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp>ここは<span class=fl><ruby>禁煙<rt>きんえん</rt></ruby></span>です。</div><div class=idn>🇮🇩 Di sini dilarang merokok.</div></div>", "6": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp>きれいに<span class=fl><ruby>結<rt>むす</rt></ruby>んで</span>ください。</div><div class=idn>🇮🇩 Tolong ikat dengan rapi.</div></div>", "7": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><span class=fl><ruby>手術<rt>しゅじゅつ</rt></ruby></span>をしなくても<ruby>治<rt>なお</rt></ruby>りますから、<ruby>大丈夫<rt>だいじょうぶ</rt></ruby>ですよ。</div><div class=idn>🇮🇩 Tanpa operasi pun akan sembuh, jadi tenang saja.</div></div>", "8": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>次<rt>つぎ</rt></ruby>の<ruby>目標<rt>もくひょう</rt></ruby>は10<span class=fl><ruby>秒<rt>びょう</rt></ruby></span>です。</div><div class=idn>🇮🇩 Target berikutnya adalah 10 detik.</div></div>", "9": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp>ボールが<ruby>遠<rt>とお</rt></ruby>くまで<span class=fl><ruby>飛<rt>と</rt></ruby>んだ</span>。</div><div class=idn>🇮🇩 Bolanya terbang sampai jauh.</div></div>", "10": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp>ここは、<span class=fl><ruby>坂道<rt>さかみち</rt></ruby></span>が<ruby>多<rt>おお</rt></ruby>いですね。</div><div class=idn>🇮🇩 Di sini banyak jalan menanjak, ya.</div></div>", "11": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp>この<ruby>皿<rt>さら</rt></ruby>だけ<ruby>色<rt>いろ</rt></ruby>が<span class=fl><ruby>違<rt>ちが</rt></ruby>います</span>。</div><div class=idn>🇮🇩 Hanya piring ini yang warnanya berbeda.</div></div>", "12": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp>あの<ruby>会社<rt>かいしゃ</rt></ruby>とは、いい<span class=fl><ruby>関係<rt>かんけい</rt></ruby></span>をつくりたい。</div><div class=idn>🇮🇩 Saya ingin menjalin hubungan baik dengan perusahaan itu.</div></div>", "13": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>父<rt>ちち</rt></ruby>は<span class=fl><ruby>教師<rt>きょうし</rt></ruby></span>をしています。</div><div class=idn>🇮🇩 Ayah saya seorang guru.</div></div>", "14": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>今<rt>いま</rt></ruby>から<ruby>行<rt>おこな</rt></ruby>うインタビューの<span class=fl><ruby>目的<rt>もくてき</rt></ruby></span>は、<ruby>授業<rt>じゅぎょう</rt></ruby>に<ruby>対<rt>たい</rt></ruby>する<ruby>希望<rt>きぼう</rt></ruby>を<ruby>聞<rt>き</rt></ruby>くことです。</div><div class=idn>🇮🇩 Tujuan wawancara yang akan dilakukan sekarang adalah m iv class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>薬<rt>くすり</rt></ruby>を<ruby>飲<rt>の</rt></ruby>んでゆっくり<ruby>休<rt>やす</rt></ruby>んだら<span class=fl>ずいぶん</span><ruby>良<rt>よ</rt></ruby>くなったので、<ruby>明日<rt>あした</rt></ruby>は<ruby>会社<rt>かいしゃ</rt></ruby>に<ruby>行<rt>い</rt></ruby>けそうです。</div><div class=idn>🇮🇩 Setelah minum obat dan istirahat, kondisinya sudah jauh lebih baik, jadi besok sepertinya bisa masuk kerja.</div></div>", "21": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>山口<rt>やまぐち</rt></ruby>さんは、どんなときでも<ruby>慌<rt>あわ</rt></ruby>てないで<span class=fl><ruby>落<rt>お</rt></ruby>ちついて</span><ruby>行動<rt>こうどう</rt></ruby>できる<ruby>人<rt>ひと</rt></ruby>だ。</div><div class=idn>🇮🇩 Yamaguchi adalah orang yang bisa bertindak dengan tenang tanpa panik dalam keadaan apa pun.</div></div>", "22": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp>パスポートを<span class=fl><ruby>申請<rt>しんせい</rt></ruby></span>するため、<ruby>必要<rt>ひつよう</rt></ruby>な<ruby>書類<rt>しょるい</rt></ruby>を<ruby>持<rt>も</rt></ruby>って<ruby>窓口<rt>まどぐち</rt></ruby>へ<ruby>行<rt>い</rt></ruby>った。</div><div class=idn>🇮🇩 Untuk mengajukan paspor, saya pergi ke loket membawa dokumen yang diperlukan.</div></div>", "23": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>服<rt>ふく</rt></ruby>にコーヒーがついて<span class=fl>しみ</span>になってしまい、<ruby>何回<rt>なんかい</rt></ruby>も<ruby>洗<rt>あら</rt></ruby>ったがきれいにならない。</div><div class=idn>🇮🇩 Kopi menempel di baju dan jadi noda; sudah dicuci berkali-kali tetap tidak bersih.</div></div>", "24": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp>あの<ruby>兄弟<rt>きょうだい</rt></ruby>は<ruby>双子<rt>ふたご</rt></ruby>みたいに<ruby>顔<rt>かお</rt></ruby>が<span class=fl>そっくり</span>で、<ruby>区別<rt>くべつ</rt></ruby>できないね。</div><div class=idn>🇮🇩 Kakak-beradik itu wajahnya mirip sekali seperti anak kembar, sampai tidak bisa dibedakan.</div></div>", "25": "<div style=\"margin-top:10px\">協力して（協力する）= bekerja sama ≈ 手伝って.< lengkap + furigana</div><div class=jp><ruby>中島<rt>なかじま</rt></ruby>さんは<span class=fl>あらゆる</span><ruby>質問<rt>しつもん</rt></ruby>に<ruby>丁寧<rt>ていねい</rt></ruby>に<ruby>答<rt>こた</rt></ruby>えた。</div><div class=lb>Kalimat dengan kata pengganti</div><div class=jp><ruby>中島<rt>なかじま</rt></ruby>さんは<span class=fl><ruby>全部<rt>ぜんぶ</rt></ruby>の</span><ruby>質問<rt>しつもん</rt></ruby>に<ruby>丁寧<rt>ていねい</rt></ruby>に<ruby>答<rt>こた</rt></ruby>えた。</div><div class=idn>🇮🇩 Nakajima menjawab semua pertanyaan dengan sopan.</div></div>", "35": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>留学中<rt>りゅうがくちゅう</rt></ruby>、ときどき<ruby>届<rt>とど</rt></ruby>く<ruby>家族<rt>かぞく</rt></ruby><span class=fl>からの</span><ruby>手紙<rt>てがみ</rt></ruby>は、<ruby>本当<rt>ほんとう</rt></ruby>にうれしかった。</div><div class=idn>🇮🇩 Surat dari keluarga yang sesekali datang selama saya studi di luar negeri benar-benar menyenangkan.</div></div>", "36": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp>（お<ruby>知<rt>し</rt></ruby>らせで）<ruby>東側<rt>ひがしがわ</rt></ruby>の<ruby>駐車場<rt>ちゅうしゃじょう</rt></ruby>は<ruby>現在<rt>げんざい</rt></ruby><ruby>工事中<rt>こうじちゅう</rt></ruby>の<span class=fl>ため</span>、<ruby>南側<rt>みなみがわ</rt></ruby>の<ruby>駐車場<rt>ちゅうしゃじょう</rt></ruby>をご<ruby>利用<rt>りよう</rt></ruby>ください。</div><div class=idn>🇮🇩 (Pengumuman) Karena parkir sisi timur sedang dalam pengerjaan, silakan gunakan parkir sisi selatan.</div></div>", "37": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp>（<ruby>駅<rt>えき</rt></ruby>のホームで）<br><ruby>妹<rt>いもうと</rt></ruby>：「ねえ、トイレへ<ruby>行<rt>い</rt></ruby>ってきてもいい？」<br><ruby>姉<rt>あね</rt></ruby>：「うん。でも<span class=fl>あと</span><ruby>5分<rt>ごふん</rt></ruby>で<ruby>電車<rt>でんしゃ</rt></ruby>が<ruby>来<rt>き</rt></ruby>ちゃうから、<ruby>急<rt>いそ</rt></ruby>いでね。」</div><div class=idn>🇮🇩 (Di peron stasiun) Adik: \"Eh, boleh aku ke toilet sebentar?\" Kakak: \"Iya. Tapi 5 menit lagi kereta datang, jadi cepat ya.\"</div></div>", "38": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp>ハンバーグを<ruby>作<rt>つく</rt></ruby>るのは<ruby>難<rt>むずか</rt></ruby>しいと<ruby>思<rt>おも</rt></ruby>っていたが、<span class=fl><ruby>作<rt>つく</rt></ruby>ってみると</span><ruby>思<rt>おも</rt></ruby>ったより<ruby>難<rt>むずか</rt></ruby>しくなかった。</div><div class=idn>🇮🇩 Saya mengira membuat hamburg itu sulit, tetapi setelah mencoba membuatnya ternyata tidak sesulit dugaan.</div></div>", "39": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>中村<rt>なかむら</rt></ruby>：「<ruby>課長<rt>かちょう</rt></ruby>、<ruby>昨日<rt>きのう</rt></ruby><span class=fl>いただいた</span>お<ruby>土産<rt>みやげ</rt></ruby>のチョコレート、とてもおいしかったです。ありがとうございました。」<br><ruby>課長<rt>かちょう</rt></ruby>：「ああ、それはよかった。」</div><div class=idn>🇮🇩 Nakamura: \"Kepala seksi, cokelat oleh-oleh yang kemarin saya terima sangat enak. Terima kasih.\" Kepala seksi: \"Oh, syukurlah.\"</div></div>", "40": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>初<rt>はじ</rt></ruby>めて<ruby>彼女<rt>かのじょ</rt></ruby>に<ruby>会<rt>あ</rt></ruby>ったとき、「なんてきれいな<ruby>人<rt>ひと</rt></ruby><span class=fl>なんだろう</span>」と<ruby>思<rt>おも</rt></ruby>った。</div><div class=idn>🇮🇩 Saat pertama bertemu dengannya, saya berpikir, \"Betapa cantiknya dia.\"</div></div>", "41": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp>（<ruby>電話<rt>でんわ</rt></ruby>で）<br><ruby>店員<rt>てんいん</rt></ruby>：「お<ruby>電話<rt>でんわ</rt></ruby>ありがとうございます。さくら<ruby>美容院<rt>びよういん</rt></ruby><span class=fl>でございます</span>。」<br><ruby>客<rt>きゃく</rt></ruby>：「すみません、<ruby>今日<rt>きょう</rt></ruby><ruby>予約<rt>よやく</rt></ruby>したいんですが。」<br><ruby>店員<rt>てんいん</rt></ruby>：「はい、ありがとうございます。<ruby>何時<rt>なんじ</rt></ruby>ごろがよろしいでしょうか。」</div><div class=idn>🇮🇩 (Lewat telepon) Pegawai: \"Terima kasih telah menelepon. Ini Salon Sakura.\" Pelanggan: \"Maaf, saya ingin reservasi hari ini.\" Pegawai: \"Baik, terima kasih. Kira-kira jam berapa yang Anda inginkan?\"</div></div>", "42": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>中西<rt>なかにし</rt></ruby>：「<ruby>川村<rt>かわむら</rt></ruby>さん、<ruby>昨日<rt>きのう</rt></ruby>のダンス<ruby>教室<rt>きょうしつ</rt></ruby>の<ruby>見学<rt>けんがく</rt></ruby>、どうだった？<ruby>入<rt>はい</rt></ruby>るの？」<br><ruby>川村<rt>かわむら</rt></ruby>：「ううん、あまり<span class=fl><ruby>面白<rt>おもしろ</rt></ruby>そうじゃなかった</span>から、<ruby>入<rt>はい</rt></ruby>らないことにしたよ。」</div><div class=idn>🇮🇩 Nakanishi: \"Kawamura, bagaimana kunjunganmu ke kelas dansa kemarin? Mau ikut?\" Kawamura: \"Tidak, sepertinya kurang menarik, jadi aku memutuskan tidak ikut.\"</div></div>", "43": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>旅行<rt>りょこう</rt></ruby>の<ruby>楽<rt>たの</rt></ruby>しみの<ruby>一<rt>ひと</rt></ruby>つは、そこ<span class=fl>でしか</span><ruby>食<rt>た</rt></ruby>べられない<ruby>料理<rt>りょうり</rt></ruby>を<ruby>食<rt>た</rt></ruby>べることだ。</div><div class=idn>🇮🇩 Salah satu kesenangan bepergian adalah makan hidangan yang hanya bisa dimakan di sana.</div></div>", "44": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp>りんごはそのまま<ruby>食<rt>た</rt></ruby>べるのもおいしいが、ジャム<span class=fl>にしても</span>おいしい。</div><div class=idn>🇮🇩 Apel enak dimakan begitu saja, dan dijadikan selai pun enak.</div></div>", "45": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>電気<rt>でんき</rt></ruby>とテレビを<span class=fl><ruby>点<rt>つ</rt></ruby>けたまま</span><ruby>朝<rt>あさ</rt></ruby>まで<ruby>寝<rt>ね</rt></ruby>てしまうことがある。</div><div class=idn>🇮🇩 Kadang saya tertidur sampai pagi dengan lampu dan TV dibiarkan menyala.</div></div>", "46": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>先月<rt>せんげつ</rt></ruby><ruby>買<rt>か</rt></ruby>った<ruby>靴<rt>くつ</rt></ruby>は、<span class=fl><ruby>歩<rt>ある</rt></ruby>きやすくて</span><ruby>足<rt>あし</rt></ruby>が<ruby>疲<rt>つか</rt></ruby>れないので<ruby>気<rt>き</rt></ruby>に<ruby>入<rt>い</rt></ruby>っている。</div><div class=idn>🇮🇩 Sepatu yang saya beli bulan lalu mudah dipakai berjalan dan kaki tidak lelah, jadi saya suka.</div></div>", "47": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp>（<ruby>電話<rt>でんわ</rt></ruby>で）<br><ruby>父<rt>ちち</rt></ruby>：「はい、<ruby>山下<rt>やました</rt></ruby>です。」<br><ruby>息子<rt>むすこ</rt></ruby>：「あ、もしもし、お<ruby>父<rt>とう</rt></ruby>さん？<ruby>今<rt>いま</rt></ruby>、お<ruby>母<rt>かあ</rt></ruby>さん、<ruby>家<rt>いえ</rt></ruby>にいる？」<br><ruby>父<rt>ちち</rt></ruby>：「ああ、いるよ。ちょうど<ruby>仕事<rt>しごと</rt></ruby>から<span class=fl><ruby>帰<rt>かえ</rt></ruby>ってきたところだ</span>よ。」</div><div class=idn>🇮🇩 (Lewat telepon) Ayah: \"Ya, Yamashita.\" Anak: \"Ah, halo, Ayah? Ibu ada di rumah sekarang?\" Ayah: \"Ya, ada. Ibu baru saja pulang kerja.\"</div></div>", "48": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>課長<rt>かちょう</rt></ruby>：「<ruby>山田<rt>やまだ</rt></ruby>さん、<ruby>資料<rt>しりょう</rt></ruby>の<ruby>整理<rt>せいり</rt></ruby>をやってもらえますか。<ruby>来週<rt>らいしゅう</rt></ruby>の<ruby>金曜<rt>きんよう</rt></ruby><span class=fl>までで</span>いいですから、できるときにお<ruby>願<rt>ねが</rt></ruby>いします。」</div><div class=idn>🇮🇩 Kepala seksi: \"Yamada, bisakah kamu merapikan dokumen? Cukup sampai Jumat minggu depan, jadi kerjakan saat ada waktu.\"</div></div>", "49": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>私<rt>わたし</rt></ruby>は、もし<ruby>自分<rt>じぶん</rt></ruby>が<ruby>患者<rt>かんじゃ</rt></ruby>だったらどうしてほしいか<span class=fl>ということを</span><ruby>考<rt>かんが</rt></ruby>えながら<ruby>看護師<rt>かんごし</rt></ruby>の<ruby>仕事<rt>しごと</rt></ruby>をしています。</div><div class=idn>🇮🇩 Saya bekerja sebagai perawat sambil memikirkan apa yang akan saya inginkan seandainya saya sendiri adalah pasien.</div></div>", "50": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>私<rt>わたし</rt></ruby>はエアコンの<ruby>風<rt>かぜ</rt></ruby>が<ruby>好<rt>す</rt></ruby>きではないので、<ruby>夏<rt>なつ</rt></ruby>の<ruby>夜<rt>よる</rt></ruby>、<ruby>暑<rt>あつ</rt></ruby>くてどうしても<ruby>寝<rt>ね</rt></ruby>られない<span class=fl>とき</span><ruby>以外<rt>いがい</rt></ruby>は、<ruby>自分<rt>じぶん</rt></ruby>の<ruby>部屋<rt>へや</rt></ruby>ではエアコンを<ruby>使<rt>つか</rt></ruby>いません。</div><div class=idn>🇮🇩 Karena tidak suka angin AC, di malam musim panas saya tidak memakai AC di kamar sendiri, kecuali saat terlalu panas dan benar-benar tidak bisa tidur.</div></div>", "51": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>最近<rt>さいきん</rt></ruby>、<ruby>田中<rt>たなか</rt></ruby>さんは<ruby>元気<rt>げんき</rt></ruby>がない。<ruby>心配<rt>しんぱい</rt></ruby>だが、<ruby>何<rt>なに</rt></ruby>があったのか<ruby>聞<rt>き</rt></ruby>いても<span class=fl><ruby>答<rt>こた</rt></ruby>えてくれないので</span><ruby>何<rt>なに</rt></ruby>もしてあげられない。</div><div class=idn>🇮🇩 Belakangan Tanaka tampak lesu. Saya khawatir, tetapi karena walau ditanya apa yang terjadi ia tidak mau menjawab, saya tidak bisa berbuat apa-apa untuknya.</div></div>", "52": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp>この<ruby>辺<rt>あた</rt></ruby>りは<ruby>自然<rt>しぜん</rt></ruby>が<ruby>多<rt>おお</rt></ruby>く、いつかこういうところに<ruby>住<rt>す</rt></ruby>んでみたいと<ruby>思<rt>おも</rt></ruby>うが、<ruby>近<rt>ちか</rt></ruby>くに<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>できる<ruby>場所<rt>ばしょ</rt></ruby>がないので、<ruby>車<rt>くるま</rt></ruby>の<ruby>運転<rt>うんてん</rt></ruby>ができない<span class=fl><ruby>私<rt>わたし</rt></ruby>には</span><ruby>生活<rt>せいかつ</rt></ruby>するのは<ruby>大変<rt>たいへん</rt></ruby>そうだ。</div><div class=idn>🇮🇩 Di sekitar sini alamnya asri dan suatu saat saya ingin tinggal di tempat seperti ini, tetapi karena tidak ada tempat belanja di dekatnya, bagi saya yang tidak bisa menyetir, hidup di sini tampaknya berat.</div></div>", "53": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>私<rt>わたし</rt></ruby>は<ruby>歌<rt>うた</rt></ruby>を<ruby>歌<rt>うた</rt></ruby>うのが<ruby>好<rt>す</rt></ruby>きで、<ruby>友達<rt>ともだち</rt></ruby>のゼミの<ruby>仲間<rt>なかま</rt></ruby>とときどきカラオケに<ruby>行<rt>い</rt></ruby>きます。いつも<ruby>大勢<rt>おおぜい</rt></ruby>で<ruby>行<rt>い</rt></ruby>くから、<ruby>自分<rt>じぶん</rt></ruby><ruby>一人<rt>ひとり</rt></ruby>がずっと<ruby>歌<rt>うた</rt></ruby>うということはできません。<span class=fl>それでも</span>、カラオケはパーティーみたいで<ruby>楽<rt>たの</rt></ruby>しいと<ruby>思<rt>おも</rt></ruby>っていました。</div><div class=idn>🇮🇩 Saya suka bernyanyi dan sesekali pergi karaoke dengan teman-teman seminar. Karena selalu pergi ramai-ramai, saya tidak bisa terus bernyanyi sendirian. Meski begitu, saya mengira karaoke seperti pesta dan menyenangkan.</div></div>", "54": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>先日<rt>せんじつ</rt></ruby><ruby>桜駅<rt>さくらえき</rt></ruby>の<ruby>近<rt>ちか</rt></ruby>くで「<ruby>一人<rt>ひとり</rt></ruby>カラオケ<ruby>専門店<rt>せんもんてん</rt></ruby>」という<ruby>店<rt>みせ</rt></ruby>を<ruby>見<rt>み</rt></ruby>つけました。<ruby>私<rt>わたし</rt></ruby>はとても<ruby>驚<rt>おどろ</rt></ruby>きました。カラオケは<ruby>人<rt>ひと</rt></ruby>と<ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>楽<rt>たの</rt></ruby>しむものだと<span class=fl><ruby>思<rt>おも</rt></ruby>っていたからです</span>。</div><div class=idn>🇮🇩 Beberapa hari lalu saya menemukan toko \"khusus karaoke solo\" dekat Stasiun Sakura. Saya sangat terkejut, karena saya mengira karaoke itu sesuatu yang dinikmati bersama orang lain.</div></div>", "55": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>一人<rt>ひとり</rt></ruby>で<ruby>行<rt>い</rt></ruby>ってもいいとわかって、<ruby>私<rt>わたし</rt></ruby>も<ruby>一人<rt>ひとり</rt></ruby>で<span class=fl><ruby>行<rt>い</rt></ruby>ってみることにしました</span>。</div><div class=idn>🇮🇩 Setelah tahu bahwa boleh pergi sendirian, saya pun memutuskan mencoba pergi sendiri.</div></div>", "56": "<div class=full><div class=lb>📖 Kalimat lengkap + furigana</div><div class=jp><ruby>私<rt>わたし</rt></ruby>はどきどきしながら、<ruby>受付<rt>うけつけ</rt></ruby>で<ruby>名前<rt>なまえ</rt></ruby>を<ruby>書<rt>か</rt></ruby>きました。そして、<span class=fl><ruby>部屋<rt>へや</rt></ruby></span>に<ruby>入<rt>はい</rt></ruby>り、まだ<ruby>上手<rt>じょうず</rt></ruby>に<ruby>歌<rt>うた</rt></ruby>えない<ruby>日本語<rt>にほんご</rt></ruby>の<ruby>歌<rt>うた</rt></ruby>を<ruby>練習<rt>れんしゅう</rt></ruby>したり、<ruby>好<rt>す</rt></ruby>きな<ruby>歌<rt>うた</rt></ruby>を<ruby>繰返<rt>くりかえ</rt></ruby>し<ruby>歌<rt>うた</rt></ruby>ったりしました。</div><div class=idn>🇮🇩 Dengan  teman nonton film, tetapi karena ada urusan saya menolak ajakan itu."], "34": ["ちちおやははしってきたこどもをりょうてでうけとった。 — Sang ayah menangkap anak yang berlari ke arahnya dengan kedua tangan. ❌ Kata yang tepat: 受け止めた（うけとめた）", "わたしのいえではまいとしホームステイのがくせいをうけとっています。 — Di rumah saya setiap tahun menampung mahasiswa homestay. ❌ Kata yang tepat: 受け入れて（うけいれて）", "おくってくださったしりょうは、ほんじつたしかにうけとりました。 — Dokumen yang Anda kirimkan sudah pasti saya terima hari ini.", "となりにいたひとがたおれそうになったので、うでをうけとってあげた。 — Orang di sebelah saya hampir jatuh, jadi saya menopang lengannya. ❌ Kata yang tepat: 支えて（ささえて）"], "35": ["と – dan/bersama<br>❌ Salah", "から – dari<br>❌ Salah", "との – (hal) dengan ~<br>❌ Salah", "からの – yang berasal dari<br>✅ Benar"], "36": ["他 – selain itu/lainnya<br>❌ Salah", "為 – karena/demi<br>✅ Benar", "とちゅう – di tengah jalan/sedang dalam proses<br>❌ Salah", "いっぽう – di sisi lain/sementara itu<br>❌ Salah"], "37": ["後 – tinggal ~ lagi (sisa waktu)<br>✅ Benar", "未だ – masih/belum<br>❌ Salah", "段々 – lama-lama/bertahap<br>❌ Salah", "いまにも – hampir/sebentar lagi<br>❌ Salah"], "38": ["つくっているうちに – selagi membuat<br>❌ Salah", "つくったとしても – meskipun membuatnya<br>❌ Salah", "つくってみると – setelah dicoba membuat<br>✅ Benar", "つくったあとで – setelah membuat<br>❌ Salah"], "39": ["居りました – ada/berada (merendah)<br>❌ Salah", "参りました – datang/pergi (merendah)<br>❌ Salah", "為さった – (beliau) melakukan (hormat)<br>❌ Salah", "頂いた – menerima (merendah)<br>✅ Benar"], "40": ["何だろう – betapa ~ (ungkapan kagum)/apa ya<br>✅ Benar", "だった – adalah (lampau)<br>❌ Salah", "みたいだ – seperti/tampaknya<br>❌ Salah", "だったのか – ternyata adalah<br>❌ Salah"], "41": ["でいらっしゃいます – (beliau) adalah (hormat untuk orang lain)<br>❌ Salah", "でございます – adalah (sopan, untuk diri sendiri/pihak sendiri)<br>✅ Benar", "と申し上げます – (saya) mengatakan/menyampaikan bahwa ~<br>❌ Salah", "とおっしゃいます – (beliau) berkata/bernama (hormat untuk orang lain)<br>❌ Salah"], "42": ["面白かった筈がない – tidak mungkin (tadi) menarik<br>❌ Salah", "面白くなければならなかった – (tadi) seharusnya/harus menarik<br>❌ Salah", "面白そうじゃなかった – tampaknya tidak menarik<br>✅ Benar", "面白くなかっただろう – mungkin tidak menarik<br>❌ Salah"], "43": ["でしか – hanya di (tempat) ~ (dengan bentuk negatif)<br>✅ Benar", "だけの – hanya milik/hanya untuk ~<br>❌ Salah", "にだけ – hanya pada ~<br>❌ Salah", "での – yang di (tempat) ~<br>❌ Salah"], "44": ["にするのに – untuk menjadikan ~<br>❌ Salah", "にしても – dijadikan ~ pun/meskipun ~<br>✅ Benar", "になると – kalau menjadi ~<br>❌ Salah", "になって – setelah menjadi ~<br>❌ Salah"], "45": ["点いている間 – selama (benda) menyala<br>❌ Salah", "点けている間 – selama (seseorang) menyalakan<br>❌ Salah", "点いたまま – (benda) tetap menyala<br>❌ Salah", "点けたまま – dibiarkan dalam keadaan dinyalakan<br>✅ Benar"], "46": ["あるきやすくて – mudah dipakai berjalan, dan ~<br>✅ Benar", "あるきすぎて – terlalu banyak berjalan, sehingga ~<br>❌ Salah", "あるきやすかったら – kalau mudah dipakai berjalan<br>❌ Salah", "あるきすぎから – (tidak gramatikal)<br>❌ Salah"], "47": ["かえってきたことがある – pernah pulang (ke sini)<br>❌ Salah", "かえっていったことがある – pernah pergi pulang<br>❌ Salah", "かえってきたところだ – baru saja pulang (ke sini)<br>✅ Benar", "かえっていったところだ – baru saja pergi pulang (menjauh dari pembicara)<br>❌ Salah"], "48": ["ですから – karena itu/jadi<br>urutan ke-4<br>❌ Salah", "で – (batas) dengan<br>urutan ke-2<br>❌ Salah", "良い – baik/cukup<br>urutan ke-3 (★)<br>✅ Benar", "迄 – sampai<br>urutan ke-1<br>❌ Salah"], "49": ["かんがえながら – sambil memikirkan<br>urutan ke-4<br>❌ Salah", "と言うことを – (hal) yang disebut ~<br>urutan ke-3 (★)<br>✅ Benar", "かんじゃだったら – kalau (saya) pasien<br>urutan ke-1<br>❌ Salah", "どうしてほしいか – ingin diperlakukan bagaimana<br>urutan ke-2<br>❌ Salah"], "50": ["どうしても – bagaimanapun/sama sekali<br>urutan ke-1<br>❌ Salah", "時 – saat<br>urutan ke-3 (★)<br>✅ Benar", "ねられない – tidak bisa tidur<br>urutan ke-2<br>❌ Salah", "いがいは – kecuali/selain ~<br>urutan ke-4<br>❌ Salah"], "51": ["きいても – meskipun bertanya<br>urutan ke-2<br>❌ Salah", "有ったのか – apa yang (sudah) terjadi<br>urutan ke-1<br>❌ Salah", "なにも – apa pun (tidak ~)<br>urutan ke-4<br>❌ Salah", "こたえてくれないので – karena tidak mau menjawab<br>urutan ke-3 (★)<br>✅ Benar"], "52": ["わたしには – bagi saya<br>urutan ke-3 (★)<br>✅ Benar", "出来ない – tidak bisa<br>urutan ke-2<br>❌ Salah", "せいかつする – hidup/tinggal<br>urutan ke-4<br>❌ Salah", "くるまのうんてんが – (soal) mengemudi mobil<br>urutan ke-1<br>❌ Salah"], "53": ["その上 – lagipula/selain itu (×, kalimat berikutnya kontras, bukan tambahan)", "とくに – terutama (×, tidak ada hal yang disorot)", "それでも – meskipun begitu ✔", "又 – juga/lagi pula (×, tidak ada hubungan penambahan)"], "54": ["おもっていたからです – karena (saya) mengira (selama ini) ✔", "おもっていたはずです – seharusnya mengira (×, 'seharusnya' tidak cocok untuk perasaan sendiri)", "おもいつづけたのです – terus mengira (×, tidak menjelaskan alasan terkejut)", "おもいつづけたようです – tampaknya terus mengira (×, 'tampaknya' tidak dipakai untuk perasaan sendiri)"], "55": ["いってみることになっています – sudah dijadwalkan/ditentukan akan mencoba pergi (×, bukan keputusan sendiri)", "いってみることにしました – memutuskan mencoba pergi ✔", "いかせてくれたことです – hal (orang lain) mengizinkan saya pergi (×, bentuk kausatif, tidak cocok)", "いかせることができました – berhasil menyuruh (orang) pergi (×, bentuk kausatif, tidak cocok)"], "56": ["へや – ruangan/kamar ✔", "そんなへや – ruangan seperti itu (×, belum ada ruangan yang disebut sebelumnya)", "こんなへや – ruangan seperti ini (×, belum ada ruangan yang diperkenalkan)", "あんなへや – ruangan seperti itu (yang jauh) (×, belum ada ruangan yang disebut)"], "57": ["だけ – hanya (×, tidak bermakna 'bahkan sendiri pun')", "より – daripada (×, tidak ada yang dibandingkan)", "なら – kalau (×, ia sudah mengalaminya, bukan pengandaian)", "でも – bahkan/～pun ✔"], "58": ["ちいさいころからじぶんでかけるから<br>↳ Karena sejak kecil bisa menulisnya sendiri (×, itu hanya dugaan penulis, bukan jawaban sang kakak)<br>💡 Penulis menduga 「小さいころから自分で書けるから」, lalu bertanya, tetapi jawaban kakaknya berbeda.", "やさしいかんじがするから<br>↳ Karena terasa lembut ✔<br>💡 「ひらがななら、優しい感じがするからという答えだった」.", "よみまちがえられることがないから<br>↳ Karena tidak akan salah dibaca (×, itu keuntungan menurut penulis, bukan alasan kakaknya)<br>💡 「読み間違えられることもないし…という良い点もあるだろう」 adalah pendapat penulis.", "おぼえてもらいやすいから<br>↳ Karena mudah diingat orang (×, itu juga hanya pendapat penulis, bukan alasan kakaknya)<br>💡 「覚えてもらいやすいという良い点もあるだろう」 adalah pendapat penulis."], "59": ["えきのかいさつぐちで、じぶんをまっていてほしい<br>↳ Ingin ditunggu di gerbang tiket stasiun (×, kali ini tidak bertemu di gerbang tiket)<br>💡 「この前のコンサートのときは駅の改札口で待ち合わせましたが、今回は直接会場に行って」.", "コンサートかいじょうにちょくせつおこなって、そとでじぶんをまっていてほしい<br>↳ Ingin Rana langsung ke tempat konser dan menunggu di luar (×, diminta masuk duluan, bukan menunggu di luar)<br>💡 「先に中に入っていてくれませんか」.", "じぶんをまたないで、さきにコンサートかいじょうにはいっていてほしい<br>↳ Ingin Rana tidak menunggunya dan masuk lebih dulu ke tempat konser ✔<br>💡 「直接会場に行って、先に中に入っていてくれませんか」.", "コンサートにおくれそうなときは、じぶんにメールしてほしい<br>↳ Ingin Rana mengirim email kepadanya bila akan terlambat (×, justru Mariko yang akan mengirim email bila terlambat)<br>💡 「遅れそうだったら、メールしますね」, jadi yang mengirim email adalah Mariko."], "60": ["コピーようしひとはこをおくってしまったこと<br>↳ Mengirim satu kotak kertas fotokopi (×, kertas fotokopi 1 kotak sesuai pesanan)<br>💡 「ご注文をいただいていたのは、コピー用紙1箱…」, jadi itu sudah benar.", "コピーようしひとはこをおくらなかったこと<br>↳ Tidak mengirim satu kotak kertas fotokopi (×, kertas fotokopi tetap terkirim)<br>💡 Yang kurang hanya lem (のり), bukan kertas fotokopi.", "のりをごほんおくってしまったこと<br>↳ Mengirim lem sebanyak 5 batang (×, yang dipesan 5 batang; yang salah adalah jumlah yang terkirim, bukan 5)<br>💡 「のり5本でしたが、のりは3本しか」.", "のりをさんぼんしかおくらなかったこと<br>↳ Hanya mengirim 3 batang lem ✔<br>💡 Dipesan 5 batang, tetapi 「のりは3本しかお送りしておりませんでした」."], "61": ["にほんでは、いなかをゆっくりはしるてつどうのたびをおおくのひとにたのしんでもらいたい<br>↳ Di Jepang, ingin banyak orang menikmati perjalanan kereta yang berjalan pelan di pedesaan (×, penulis tidak meminta orang lain menikmatinya)<br>💡 Penulis hanya menceritakan kesukaannya dan bersyukur atas sejarahnya.", "にほんでは、かなりのいなかにすんでいても、てつどうがとおっているのでべんりだ<br>↳ Di Jepang, walau tinggal di pedesaan jauh pun kereta lewat sehingga praktis (×, kepraktisan hidup tidak dibahas)<br>💡 Teks membahas sejarah mengapa rel sampai ke pedesaan, bukan kepraktisan penduduk.", "にほんでは、じてんしゃのたびもてつどうのたびもたのしめるようになったので、うれしい<br>↳ Di Jepang, perjalanan bersepeda dan kereta kini bisa dinikmati, jadi senang (×, sepeda tidak disebut)<br>💡 Yang dibandingkan adalah kereta dan mobil (自動車), bukan sepeda.", "にほんでは、てつどうがじどうしゃよりまえにいどうしゅだんとしてひろくつかわれるようになってよかった<br>↳ Di Jepang, senang bahwa kereta lebih dulu daripada mobil dipakai luas sebagai alat transportasi ✔<br>💡 「自動車より前に鉄道が移動手段として広く使われるようになったから…この歴史に感謝したい」."], "62": ["パーティーなのに、めいしをわたされたから<br>↳ Karena di pesta diberi kartu nama (×, yang mengherankan bukan karena diberi kartu nama, tetapi bentuknya kue)<br>💡 「これ、私の名刺です」 lalu yang diberikan adalah kue.", "めいしだといわれたのに、クッキーをわたされたから<br>↳ Karena dikatakan kartu nama, tetapi yang diberikan adalah kue ✔<br>💡 Dikatakan 「これ、私の名刺です」, tetapi yang diberikan 「袋に入った1枚のクッキー」, maka ia heran.", "クッキーになまえとかいしゃめいがかいてあったから<br>↳ Karena di kue tertulis nama dan nama perusahaan (×, itu baru ia ketahui setelah melihat dengan saksama)<br>💡 「よく見ると、クッキーの表に名前と会社名が書いてあった」, setelah rasa heran.", "めいしなのにたべられるといわれたから<br>↳ Karena dikatakan bisa dimakan padahal kartu nama (×, ucapan 「食べられますよ」 muncul setelah ia heran)<br>💡 Lawan bicara mengatakannya sambil tertawa, setelah ia memandang kue itu."], "63": ["かみでできているしかくいめいし<br>↳ Kartu nama persegi yang terbuat dari kertas ✔<br>💡 「名刺は普通、四角い紙でできている」.", "きやプラスチックでできているめいし<br>↳ Kartu nama dari kayu atau plastik (×, itu termasuk contoh kartu nama yang unik)<br>💡 「木やプラスチックでできたもの」 adalah contoh kartu nama unik.", "かおりがついているめいし<br>↳ Kartu nama yang diberi aroma (×, itu termasuk contoh kartu nama yang unik)<br>💡 「香りがついたもの」 adalah contoh kartu nama unik.", "クッキーのめいし<br>↳ Kartu nama berbentuk kue (×, itu kartu nama unik yang diterima penulis)<br>💡 Itulah kartu nama yang membuatnya heran."], "64": ["ほかのひととめいしをこうかんするたのしみがふえる<br>↳ Kesenangan bertukar kartu nama dengan orang lain bertambah (×, tidak disebut di teks)<br>💡 Teks tidak membahas kesenangan bertukar kartu nama.", "ほかのひととちがった、あたらしいしごとややりかたがみつかる<br>↳ Menemukan pekerjaan atau cara baru yang berbeda dari orang lain (×, itu hanya dugaan penulis tentang cara kerja baru, bukan manfaat yang disebut)<br>💡 「最近の新しい仕事のやり方なのかもしれない」.", "じぶんのなまえをあいてにおぼえてもらえ、しごとのはなしがうまくいく<br>↳ Nama diingat lawan bicara dan pembicaraan kerja berjalan lancar ✔<br>💡 「すぐに名前を覚えてもらえるだけでなく、話しが広がり、仕事の話がうまくいく場合もある」.", "じぶんもかわっためいしがもらえ、あいてのなまえをしっかりおぼえていられる<br>↳ Diri sendiri juga menerima kartu nama unik dan bisa mengingat nama lawan dengan baik (×, tidak disebut di teks)<br>💡 Teks hanya membahas agar nama pemberi kartu diingat orang lain."], "65": ["とてもうまくいっている<br>↳ Berjalan sangat baik (×, penulis merasa sulit memuji)<br>💡 「ほめ方の難しさを感じています」.", "うまくいっている<br>↳ Berjalan baik (×, penulis merasa sulit memuji)<br>💡 「親の期待の通りにはならないことが多く」.", "あまりうまくいっていない<br>↳ Kurang berjalan baik ✔<br>💡 Anak sering puas dan tidak berusaha lebih (「それ以上頑張ろうとしなくなる」); penulis merasa sulit.", "ぜんぜんうまくいっていない<br>↳ Sama sekali tidak berjalan baik (×, terlalu ekstrem; teks hanya mengatakan 'kadang-kadang')<br>💡 「～こともあります」, bukan 'sama sekali tidak'."], "66": ["あたまのよさをほめられたこどものおおくは、あたらしいもんだいをとこうとした<br>↳ Banyak anak yang dipuji kepintarannya mencoba soal baru (×, kebalikannya)<br>💡 「頭の良さをほめられたグループでは…多くの子供が同じ問題を解きました」.", "あたまのよさをほめられたこどものおおくは、おなじもんだいをとこうとしなかった<br>↳ Banyak anak yang dipuji kepintarannya tidak mencoba soal yang sama (×, kebalikannya; mereka justru banyak memilih soal yang sama)<br>💡 「多くの子供が同じ問題を解きました」.", "どりょくをほめられたこどものおおくは、あたらしいもんだいをとこうとした<br>↳ Banyak anak yang dipuji usahanya mencoba soal baru ✔<br>💡 「努力をほめられたグループでは、90％が新しい問題にチャレンジした」.", "どりょくをほめられたこどものおおくは、あたらしいもんだいをとこうとしなかった<br>↳ Banyak anak yang dipuji usahanya tidak mencoba soal baru (×, kebalikannya; 90% memilih soal baru)<br>💡 「90％が新しい問題にチャレンジした」."], "67": ["「ずっとしゅうちゅうしてがんばっていたね。ほんとうにかんしんしたよ。」<br>↳ \"Kamu terus berkonsentrasi dan berusaha keras. Aku benar-benar kagum.\" ✔<br>💡 Memuji usaha (努力), dan kelompok yang dipuji usahanya 90% menantang soal baru.", "「とてもよくできたね。すごくあたまがいいんだね。」<br>↳ \"Kamu sangat bisa. Kamu benar-benar pintar.\" (×, memuji kepintaran; kelompok ini banyak memilih soal yang sama)<br>💡 「頭の良さ」 dipuji → banyak anak memilih soal yang sama.", "「ぜんぜんべんきょうしなくてもできたんだから、えらいなあ。」<br>↳ \"Kamu bisa walau sama sekali tidak belajar, hebat ya.\" (×, memuji kemampuan bawaan, bukan usaha)<br>💡 Bukan 「努力」 yang dipuji.", "「むずかしいもんだいなのに、かんたんにできちゃったね。おどろいたよ。」<br>↳ \"Soal sulit, tapi kamu bisa mengerjakannya dengan mudah. Aku terkejut.\" (×, memuji kemudahan/bakat, bukan usaha)<br>💡 Bukan 「努力」 yang dipuji."], "68": ["にほんのなつのへいきんきおんがあがっていること<br>↳ Suhu rata-rata musim panas di Jepang yang naik (×, itu latar belakang, bukan yang dikatakan 'tak terhindarkan')<br>💡 Yang disebut しかたない adalah menyalakan AC saat panas ekstrem.", "ひじょうにあついひにエアコンをつかうこと<br>↳ Memakai AC pada hari yang sangat panas ✔<br>💡 「非常に暑い日は…ほとんどの人がエアコンのスイッチを入れる。ひどい暑さは体にも悪い影響を与えるし、しかたないことだ」.", "ひどいあつさをがまんしなければならないこと<br>↳ Harus menahan panas yang parah (×, justru panas parah berbahaya bagi tubuh, jadi tidak perlu ditahan)<br>💡 「ひどい暑さは体にも悪い影響を与える」.", "それぞれのいえになんだいもエアコンがあること<br>↳ Tiap rumah punya beberapa unit AC (×, itu disebut sebagai sumber kekhawatiran kekurangan listrik)<br>💡 「それぞれの家に何台もエアコンがある今、…電気が足りなくなる心配」."], "69": ["あつさでびょうきにならないようにきをつけてほしいとかんがえているから<br>↳ Karena ingin warga berhati-hati agar tidak sakit karena panas (×, tujuannya menghemat listrik)<br>💡 「できるだけ夏の電気の消費量を抑えよう」.", "あつさでひとがあつまらなくなるばしょにいってほしいとかんがえているから<br>↳ Karena ingin warga pergi ke tempat yang sepi karena panas (×, justru diminta berkumpul di tempat sejuk)<br>💡 「涼しい場所に集まって時間を過ごす」.", "それぞれのいえのエアコンのかずをへらしてほしいとかんがえているから<br>↳ Karena ingin tiap rumah mengurangi jumlah AC (×, yang dikurangi pemakaian bersamaan, bukan jumlah unit)<br>💡 「町の中で同時に使われるエアコンはずっと減る」.", "それぞれのいえでつかうでんきのりょうをすくなくしてほしいとかんがえているから<br>↳ Karena ingin tiap rumah mengurangi jumlah listrik yang dipakai ✔<br>💡 Dengan berkumpul di tempat sejuk, pemakaian AC serentak berkurang → konsumsi listrik turun."], "70": ["エアコンをつかわないなにもできないようなあついひにいくこと<br>↳ Datang pada hari sangat panas tanpa memakai AC (×, tidak ada syarat seperti itu)<br>💡 Syaratnya hanya mengatakan sudah mematikan AC di rumah.", "ケーしがくばっているちずをもっていくこと<br>↳ Membawa peta yang dibagikan Kota K (×, tidak disebut perlu membawa peta)<br>💡 Syarat layanan adalah ucapan, bukan membawa peta.", "いえのエアコンをとめてきたとつたえること<br>↳ Mengatakan sudah mematikan AC di rumah ✔<br>💡 「家のエアコンを止めて来たと言えば、…サービスが受けられたり」.", "いえにエアコンがないとつたえること<br>↳ Mengatakan di rumah tidak ada AC (×, tidak disebut di teks)<br>💡 Syaratnya mematikan AC, bukan tidak punya AC."], "71": ["なつのでんきしようりょうをおさえるためのしやまちのくふう<br>↳ Upaya kota dan daerah untuk menekan pemakaian listrik di musim panas ✔<br>💡 「できるだけ夏の電気の消費量を抑えようという工夫や活動」.", "なつのしょうひかつどうをふやすためのしやまちのくふう<br>↳ Upaya kota dan daerah untuk menambah aktivitas konsumsi di musim panas (×, tidak disebut di teks)<br>💡 Yang dibahas penghematan listrik, bukan peningkatan konsumsi.", "ひとびとがしぜんのなかですごせるようにするためのしやまちのくふう<br>↳ Upaya kota dan daerah agar orang bisa menghabiskan waktu di alam (×, tempat sejuk hanya sarana, bukan tema)<br>💡 Tempat seperti taman hanya contoh tempat sejuk.", "ひとびとのコミュニケーションをさかんにするためのしやまちのくふう<br>↳ Upaya kota dan daerah untuk menyuburkan komunikasi warga (×, itu hanya efek tambahan)<br>💡 「…という効果も出ている」, bukan tujuan utama."], "72": ["じゅういちがつむいかのじゅうじごじゅっぷんから<br>↳ Dari pukul 10.50 pada 6 November (×, pada 6 November (✩) pukul 10.50 dipakai Grup A dan B)<br>💡 Hari ✩: 前半 A、B; 後半 C、D.", "じゅういちがつむいかのじゅういちじにじゅうごふんから<br>↳ Dari pukul 11.25 pada 6 November ✔<br>💡 6 November (✩): Grup C dan D memakai paruh kedua (11.25–12.00); ini yang paling awal.", "じゅういちがつじゅうさんにちのじゅうじごじゅっぷんから<br>↳ Dari pukul 10.50 pada 13 November (×, tanggalnya lebih lambat daripada 6 November)<br>💡 13 November (★) memang jam 10.50 untuk Grup C, tetapi setelah 6 November.", "じゅういちがつじゅうさんにちのじゅういちじにじゅうごふんから<br>↳ Dari pukul 11.25 pada 13 November (×, hari ★ paruh kedua dipakai Grup A dan B)<br>💡 Hari ★: 前半 C、D; 後半 A、B."], "73": ["じゅういちがつむいか<br>↳ 6 November (×, itu dua kali pertemuan sebelumnya)<br>💡 Yang diminta adalah 「1回前の授業の日」, yaitu pertemuan sebelumnya.", "じゅういちがつじゅうさんにち<br>↳ 13 November ✔<br>💡 Tanggal 20 November 「授業はありません」, jadi 1 pertemuan sebelum 27 November adalah 13 November.", "じゅういちがつはつか<br>↳ 20 November (×, hari itu tidak ada kelas)<br>💡 「11月20日　授業はありません」.", "じゅういちがつにじゅうしちにち<br>↳ 27 November (×, itu hari wawancara itu sendiri)<br>💡 Rencana ditunjukkan di pertemuan sebelum hari wawancara."]};
const L=['','1','2','3','4'];let S=JSON.parse(JSON.stringify(D.map(()=>0)));let seenG={};
function blanks(s){return s.replace("{B2}",'<span class=bl>　</span><span class=bl>★</span><span class=bl>　</span><span class=bl>　</span>').replace("{B}",'<span class=bl>　</span><span class=bl>　</span><span class=bl>★</span><span class=bl>　</span>')}
function render(){const el=document.getElementById('list');let h='',lastG='',cnt={};
D.forEach((d,i)=>{const gk=d[0];const isB=gk[0]=='b';const num=i<35?i+1:i-34;
if(gk!=lastG){h+=`<div class=gi>${GI[gk]}</div>`;lastG=gk}
const lbl=(i<35?'A':'B')+num;const open=!seenG[d[5]]?'open':'';if(d[5])seenG[d[5]]=1;
h+=`<div class=card id=c${i}><div class=mu>Soal ${i+1}/${D.length} · ${lbl}</div>`;
if(d[5]){const key=d[5];h+=`<details class=p ${open}><summary>Bacaan</summary>${P[key]}</details>`}
h+=`<div class=q>${blanks(d[1])}</div>`;
d[2].forEach((o,k)=>{h+=`<button class=o id=o${i}_${k+1} onclick="ans(${i},${k+1})">${k+1}. ${o}</button>`});
h+=`<div class=ex id=e${i} style="display:none"></div></div>`});el.innerHTML=h;seenG={};nav()}
function ans(i,k){if(S[i])return;S[i]=k;const d=D[i],ok=k==d[3];
document.getElementById('o'+i+'_'+k).classList.add(d[3]?(ok?'ok':'no'):'no');if(d[3])document.getElementById('o'+i+'_'+d[3]).classList.add('ok');(DT[i]||[]).forEach((t,j)=>{const b=document.getElementById('o'+i+'_'+(j+1)),m=document.createElement('small');if(DTH[i]){b.innerHTML=(j+1)+'. '+OPH[i][j];m.innerHTML='→ '+DTH[i][j]}else{m.textContent='→ '+t}b.appendChild(m)});
const e=document.getElementById('e'+i);e.style.display='block';
e.innerHTML=(!d[3]?'⚠ <b>Kunci belum pasti</b> (pengumuman tidak ada di teks salinan; lihat PDF)':ok?'✅ <b style=color:var(--ok)>Benar!</b>':'❌ <b style=color:var(--no)>Salah.</b> Jawaban benar: '+d[3])+'<br>'+d[4]+(FXH[i]||'');sc();nav()}
function sc(){let c=0,t=0;S.forEach((v,i)=>{if(v){t++;if(v==D[i][3])c++}});document.getElementById('sc').textContent='Skor '+c+'/'+t;document.getElementById('pg').textContent='· dijawab '+t+'/'+D.length;
document.getElementById('fin').textContent=t==D.length?'Selesai! Skor akhir '+c+'/'+D.length+' ('+Math.round(c/D.length*100)+'%)':'Skor sementara '+c+'/'+t}
